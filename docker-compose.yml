services:
  securefrontrepair:
    build:
      context: .
      dockerfile: Dockerfile
    image: securefrontrepair:latest
    container_name: securefrontrepair
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://securefrontrepair.com
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
